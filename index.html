<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AtelierAI iPad – Aktuelle Version</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f4}
    body{display:grid;place-items:center}
    #status{padding:18px 22px;border-radius:14px;background:white;box-shadow:0 2px 14px rgba(0,0,0,.08);font-size:16px}
  </style>
</head>
<body>
  <div id="status">AtelierAI wird geladen …</div>
  <script>
  (async function(){
    const stamp = Date.now().toString(36) + Math.random().toString(36).slice(2);
    const url = './app.html?latest=' + encodeURIComponent(stamp);
    try{
      const response = await fetch(url, {
        cache: 'no-store',
        headers: {'Cache-Control':'no-cache'}
      });
      if(!response.ok) throw new Error('HTTP ' + response.status);
      const html = await response.text();
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      // Fallback ebenfalls mit einmaliger URL, damit Safari keine alte App nimmt.
      location.replace(url);
    }
  })();
  </script>
</body>
</html>
