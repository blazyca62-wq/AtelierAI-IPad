<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AtelierAI Bildauswahl Diagnose</title><style>body{font:17px -apple-system,system-ui,sans-serif;padding:18px;max-width:700px;margin:auto}input{font-size:18px;padding:14px;max-width:100%;box-sizing:border-box;border:2px solid #26765b;border-radius:8px}#status{white-space:pre-wrap;background:#eef3f0;padding:14px;margin:14px 0;border-radius:8px}img{max-width:100%;max-height:60vh;display:none}button{font-size:16px;padding:10px}</style></head><body><h2>AtelierAI – Import-Diagnose</h2><p>1. Prüfe, ob unten „JavaScript läuft“ steht. 2. Wähle ein Bild aus.</p><p id="js">JavaScript wurde noch nicht gestartet.</p><input id="pick" type="file" accept="image/*,.heic,.heif" onchange="window.receiveFile && window.receiveFile(this)" oninput="window.receiveFile && window.receiveFile(this)"><div id="status">Noch kein Bild ausgewählt.</div><img id="preview" alt="Vorschau"><button type="button" onclick="window.receiveFile && window.receiveFile(document.getElementById('pick'))">Auswahl erneut prüfen</button><script>
(function(){'use strict';var js=document.getElementById('js'),status=document.getElementById('status'),img=document.getElementById('preview'),input=document.getElementById('pick');js.textContent='✓ JavaScript läuft';var previous='',objectURL=null;
window.receiveFile=function(el){try{var f=el.files&&el.files[0];if(!f){status.textContent='Dateidialog geöffnet, aber Safari hat keine Bilddatei übergeben.';return;}var signature=f.name+'|'+f.size+'|'+f.lastModified;if(signature===previous&&img.style.display==='block')return;previous=signature;status.textContent='Datei erkannt: '+f.name+' ('+Math.round(f.size/1024)+' KB)\nVorschau wird geladen …';img.style.display='none';img.onload=function(){img.style.display='block';status.textContent='✓ Bild sichtbar: '+f.name+' ('+img.naturalWidth+' × '+img.naturalHeight+')';};img.onerror=function(){status.textContent='Datei erkannt, aber Vorschau mit Blob nicht möglich. Versuche zweiten Weg …';var reader=new FileReader();reader.onload=function(){img.src=reader.result};reader.onerror=function(){status.textContent='Datei erkannt, aber auch FileReader kann sie nicht lesen.'};reader.readAsDataURL(f);};if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);img.src=objectURL;}catch(e){status.textContent='Fehler: '+e.message;}};
input.addEventListener('change',function(){window.receiveFile(input)});input.addEventListener('input',function(){window.receiveFile(input)});
})();
</script></body></html>
